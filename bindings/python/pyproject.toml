# Build configuration for maturin: builds the Python wheel from the Rust crate.
[build-system]
# Building is done exclusively with maturin.
requires = ["maturin>=1.5"]
# maturin is at the same time the build backend.
build-backend = "maturin"

# Metadata of the resulting Python package.
[project]
# The import name of the installed Python module.
name = "bit_sequences"
# The version of the Python package (follows the Rust crate).
version = "0.1.0"
# A one-line description for the package index.
description = "Python bindings of the Rust implementation of the paper 'The Evaluation of Finite Bit Sequences'"
# The minimum Python version of the abi3 wheel.
requires-python = ">=3.8"

# maturin-specific settings.
[tool.maturin]
# The extension module is only linked for the Python build.
features = ["pyo3/extension-module"]
