# Crate der Python-Bindings: baut die Kernbibliothek als Erweiterungsmodul.
[package]
# Name des Binding-Crates im Arbeitsbereich.
name = "bitfolgen-python"
# Von Arbeitsbereich geerbte Version.
version.workspace = true
# Von Arbeitsbereich geerbte Edition.
edition.workspace = true
# Kurze Beschreibung des Crates.
description = "Python-Bindings (PyO3) fuer die Rust-Implementierung des Papers 'The Evaluation of Finite Bit Sequences'"

# Das Ergebnis ist ein dynamisch ladbaren Python-Modul, keine normale Rust-Bibliothek.
[lib]
# Der Python-Importname heisst ebenfalls bitfolgen.
name = "bitfolgen"
# Nur cdylib: das Erzeugnis ist die Python-Erweiterungsdatei (.so).
crate-type = ["cdylib"]

# Abhaengigkeiten des Bindings.
[dependencies]
# Die Kernbibliothek aus dem Arbeitsbereich; heisst hier explizit kernbibliothek,
# weil der Python-Modulname (lib name) bereits bitfolgen belegt.
kernbibliothek = { package = "bitfolgen", path = "../../bitfolgen" }
# PyO3 als Bruecke zwischen Rust und Python; abi3 wheel ab Python 3.8.
pyo3 = { version = "0.22.6", features = ["abi3-py38"] }
