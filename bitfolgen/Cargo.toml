# Paket der Kernbibliothek: Implementierung des Papers ohne externe Abhaengigkeiten.
[package]
# Name des Kernpakets im Arbeitsbereich.
name = "bitfolgen"
# Von Arbeitsbereich geerbte Version.
version.workspace = true
# Von Arbeitsbereich geerbte Edition.
edition.workspace = true
# Kurze Beschreibung des Pakets.
description = "Implementierung des Papers 'The Evaluation of Finite Bit Sequences' (Einschritttest, Klassen B_N, Generatoren, Komposition)"

# Die Bibliothek enthaelt alle Paper-Algorithmen als Module.
[lib]
# Bibliotheksname fuer `use bitfolgen::...`.
name = "bitfolgen"
# Einstiegspunkt der Bibliothek.
path = "src/lib.rs"

# Das Kommandozeilenwerkzeug wertet einen Datenbestand aus (Paper-Abschnitt 5).
[[bin]]
# Name des ausfuehrbaren Programms.
name = "auswertung"
# Einstiegspunkt des Programms.
path = "src/bin/auswertung.rs"

# Keine externen Abhaengigkeiten: das Paper kommt mit Standardwerkzeugen aus.
[dependencies]
