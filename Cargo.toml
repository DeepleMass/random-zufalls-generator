# Workspace comprising all Rust parts of the project.
[workspace]
# The core library resides in the bit_sequences subdirectory.
members = [
    # Core library including the evaluate command-line tool.
    "bit_sequences",
    # Python bindings via PyO3 (built as an extension module).
    "bindings/python",
]
# Modern feature-flag resolution for the entire workspace.
resolver = "2"

# Workspace metadata; inherited by all members.
[workspace.package]
# The version shared by all workspace members.
version = "0.1.0"
# The Rust edition shared by all workspace members.
edition = "2021"

# No global dependencies; every member manages its own.
[workspace.dependencies]
