# Arbeitsbereich (Workspace) mit allen Rust-Bauteilen des Projekts.
[workspace]
# Die Kernbibliothek liegt im Unterordner bitfolgen.
members = [
    # Kernbibliothek samt Kommandozeilenwerkzeug auswertung.
    "bitfolgen",
    # Python-Bindings ueber PyO3 (gebaut als Erweiterungsmodul).
    "bindings/python",
]
# Moderne Auflösung der Feature-Flags für den gesamten Arbeitsbereich.
resolver = "2"

# Metadaten des Arbeitsbereichs; von den Mitgliedern geerbt.
[workspace.package]
# Die gemeinsame Version aller Glieder des Arbeitsbereichs.
version = "0.1.0"
# Die Rust-Edition aller Glieder des Arbeitsbereichs.
edition = "2021"

# Keine globalen Abhaengigkeiten; jedes Glied verwaltet seine eigenen.
[workspace.dependencies]
